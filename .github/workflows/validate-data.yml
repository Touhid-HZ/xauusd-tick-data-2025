name: Validate tick data

# Integrity check for the complete 2025 dataset. 2025 is a closed calendar
# year, so there is nothing to update — this workflow simply re-verifies the
# data. Run it on demand from the Actions tab ("Run workflow"); it also runs
# automatically whenever data files change on main.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/verify_data.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Verify data integrity (53 weekly files, 71.4M rows)
        run: python scripts/verify_data.py
